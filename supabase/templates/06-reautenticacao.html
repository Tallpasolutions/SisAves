<head>

<body style="margin:0;padding:0;background-color:#F4F7F6;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F4F7F6;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:560px;">

          <tr>
            <td style="padding-bottom:20px;">
              <img src="https://sisaves.tallpa.com.br/brand/sisaves-email.png" width="160" height="47" alt="SisAves" style="display:block;border:0;outline:none;text-decoration:none;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:22px;font-weight:700;color:#163A45;">
            </td>
          </tr>

          <tr>
            <td bgcolor="#FFFFFF" style="border:1px solid #DBE3E3;border-radius:8px;padding:32px;">
              <h1 style="margin:0 0 16px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:20px;font-weight:600;color:#163A45;line-height:1.3;">Confirme que é você</h1>
              <p style="margin:0 0 12px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:15px;line-height:1.55;color:#1B2528;">Digite este código para concluir a operação:</p>

              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0;">
                <tr>
                  <td align="center" bgcolor="#F4F7F6" style="border:1px solid #DBE3E3;border-radius:5px;padding:16px 32px;">
                    <span style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:28px;font-weight:600;letter-spacing:0.18em;color:#163A45;">{{ .Token }}</span>
                  </td>
                </tr>
              </table>
              <p style="margin:0 0 12px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:15px;line-height:1.55;color:#1B2528;">Ele vale por poucos minutos.</p>
              <p style="margin:16px 0 0;padding-top:16px;border-top:1px solid #DBE3E3;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:13px;line-height:1.5;color:#5A6B70;">Se não foi você que pediu, alguém pode ter acesso à sua conta. Troque a senha.</p>
            </td>
          </tr>

          <tr>
            <td style="padding-top:20px;">
              <p style="margin:0;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:13px;line-height:1.5;color:#5A6B70;">
                SisAves &middot; gestão de criatórios de aves ornamentais<br>
                Dúvidas? Responda para <a href="mailto:suporte@tallpa.com.br" style="color:#0B5D5E;">suporte@tallpa.com.br</a>
              </p>

          </tr>

        </table>
